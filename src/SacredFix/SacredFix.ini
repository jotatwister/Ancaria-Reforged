; SacredFix: configuración
; Va junto a Sacred.exe. Si falta una clave, se usa su valor por defecto. 1 = activado, 0 = desactivado.

[General]
Enabled=1               ; 0 = la DLL solo reenvía las llamadas a DirectDraw, sin ningún parche
Log=0                   ; escribe SacredFix.log en la carpeta del juego (1 = sí; útil para informar de un fallo)

[Fixes]
Force32Bit=1            ; color de 32 bits siempre (el modo de 16 bits se cuelga en Windows 8 y posteriores)
VideoModeFallback=1     ; si no existe el modo de vídeo pedido, usa el más parecido en vez de cerrarse
FocusFix=1              ; no colgarse al arrancar si Windows no deja a la ventana pasar a primer plano
Widescreen=1            ; resolución panorámica (ver Width, Height y Groups en [Display])
ObjectCache=1           ; caché de objetos del mundo más grande: sin bajones con el zoom alejado en las ciudades
ObjectCacheSize=16384   ; tope de objetos de esa caché (el juego traía 4096)
LayeredTiles=1          ; más baldosas con hierba y detalles por fotograma: sin hierba lisa en los lados con pantallas anchas
LayeredTilesMax=16384   ; tope de esas baldosas (el juego traía 1750)
TrackEnemy=1            ; con «seguir al enemigo» del juego activado, el cursor se queda sobre el enemigo atacado aunque se mueva
TrackEnemyLift=40       ; altura (px) sobre los pies del enemigo donde se pone el cursor

[Display]
; --- Dibujo ---
Renderer=d3d11          ; d3d11 = motor Direct3D 11 (nuevo); d3d9 = capa propia sobre Direct3D 9 (antialiasing, ventana, Alt+Tab); ddraw = DirectDraw de Windows
D3D9Window=borderless   ; con d3d9 o d3d11: borderless = pantalla completa sin bordes, window = ventana con marco,
                        ;           fullscreen = exclusiva (con d3d9 no se recupera al pinchar fuera)
MultiSample=4           ; antialiasing (d3d9: solo lo 3D; d3d11: también lo 2D): 0 = no, 2, 4, 8
RenderScale=auto        ; con d3d11: resolución interna. auto = a la altura de la pantalla (misma vista, más nítido); 1 = la del juego; 1.5, 2... = esa escala
KeepAspect=1            ; con d3d11: la imagen conserva su proporción (bandas negras en monitores que no son 16:9); 0 = estirar
DpiAware=1              ; con d3d9/d3d11: compatible con el escalado de Windows (125-200%), para que no se vea borroso en 4K y portátiles
MaxFps=0                ; límite de FPS (0 = el del monitor). En monitores de 120/144 Hz, 60 deja el juego como en uno de 60 Hz
Anisotropy=16           ; con d3d11: filtrado anisótropo de los modelos 3D (con mipmaps): 0 = no, 2, 4, 8, 16
AlphaToCoverage=1       ; con d3d11 y MSAA: bordes suaves en lo 3D recortado por transparencia (pelo, hojas de modelos)
Sharpen=0.4             ; con d3d11: enfoque adaptativo de la imagen final, de 0 (nada) a 1 (máximo)
FontSharp=1             ; con d3d11 y RenderScale: nitidez de las letras del juego al ampliarlas, de 0 (filtro normal, más borrosas) a 1 (máximo)
PixelLighting=1         ; con d3d11: luz por píxel en personajes y objetos 3D (sombreado suave con antorchas y hechizos); 0 = por vértice, como el original
Gamma=1.0               ; con d3d11: ajuste de color. Gamma: más de 1 aclara los tonos medios, menos de 1 los oscurece
Contrast=1.0            ;   contraste (1 = igual; 1.1 = algo más)
Brightness=0.0          ;   brillo (0 = igual; de -0.5 a 0.5)
Saturation=1.0          ;   viveza de los colores (1 = igual; 0 = blanco y negro; 1.2 = más vivos)
CloseGaps2D=0.5         ; con d3d11 y MSAA: ensancha las piezas 2D del mundo (en píxeles) para tapar las juntas finas (Underworld); 0 = no
D3D9Videos=1            ; con d3d9: 1 = vídeos de inicio y cinemáticas; 0 = se saltan
; --- Resolución panorámica ---
Width=auto              ; ancho de la imagen del juego; auto = según la proporción del monitor (16:9 -> 1366, 16:10 -> 1229, 4:3 -> 1024, 21:9 -> hasta 1840)
Height=768              ; alto (la interfaz está hecha para 768)
Groups=1,2,6,7,8,9,10,13,161,18 ; grupos del parche panorámico que se aplican (no cambiar salvo para pruebas)
; --- Interfaz ---
UiCenter=1              ; interfaz y menús centrados en un lienzo de 1024x768
MenuBackground=1        ; los fondos de los menús ocupan toda la pantalla (estirados a lo ancho)
PortraitsRight=1        ; retratos del grupo pegados al borde derecho

[Menu]
Enabled=1               ; menú de opciones propio dentro del juego (con d3d9 o d3d11)
Key=                    ; tecla que lo abre y lo cierra (F1-F12); vacía = solo con la opción «Ancaria Reforged» de los menús del juego
EscButton=1             ; botón «Ancaria Reforged» en el menú de Escape del juego
MainButton=1            ; opción «Ancaria Reforged» en el menú principal del juego
Language=es             ; idioma de los textos de SacredFix: es = castellano, en = inglés

[Language]
Game=juego              ; idioma de los textos del juego: juego = el de Settings.cfg, o US, DE, FR, SP, IT, PL, HU, JP, VC, RU, CZ (con su global.res en scripts\<código>)
Voices=juego            ; idioma de las voces: juego = el sound.pak original, o el código de un idioma con su sound.pak en pak\<código>

[Fonts]
Text=juego              ; letra de los textos del juego y del mod: juego = AntiquaSSK, o el nombre de una fuente instalada (o de un .ttf/.otf de la carpeta font)
Title=juego             ; letra de títulos, botones y menús: juego = Carolingia, o el nombre de una fuente
Size=11                 ; tamaño de todas las letras del juego, de 8 a 14 (11 = el original); se aplica al reiniciar

[Fps]
Enabled=0               ; contador de fotogramas por segundo (también en F10)
X=6                     ; posición (píxeles de la imagen del juego; esquina superior izquierda)
Y=6
Size=16                 ; alto del texto

[MiniMap]
Enabled=1               ; minimapa siempre visible en la partida
X=80                    ; posición (píxeles de pantalla; a la derecha del contador de FPS)
Y=6
Size=120                ; diámetro del mapa en píxeles (el aro añade 11 px por lado)
Alpha=224               ; opacidad (96..255)
Zoom=50                 ; escala del mapa respecto al del tabulador (%)
TextZoom=80             ; escala de los textos y símbolos del mapa (%)

[Buffs]
Enabled=1               ; iconos de los buffs propios activos (refuerzos, auras, formas) junto al retrato
Size=32                 ; lado de cada icono
Y=14                    ; altura (píxeles de pantalla)
Right=104               ; distancia del primer icono al borde derecho (a la izquierda de los retratos)
Variant=2               ; dibujo del icono: 0 = gris, 1 y 2 = las variantes de color
Crop=12                 ; % del icono que se recorta por cada lado (su borde propio) para llenar el aro
Show=                   ; números de artes (1000+) o hechizos (1-72) que deben salir aunque la regla no los incluya
Hide=                   ; números que no deben salir nunca
Permanent=              ; números que se muestran sin tiempo (hasta que muere el héroe)

[Keys]
CooldownSeconds=1       ; segundos de recarga sobre los iconos de artes de la barra
QuickCast=1             ; las teclas de arte (6-0) eligen el arte y lo lanzan hacia el cursor, sin clic derecho
HoldMs=350              ; tiempo (ms) que se mantiene «pulsado» el botón derecho al lanzar con una tecla
CastDelayMs=80          ; espera (ms) entre elegir el arte y lanzarlo
Remap=                  ; teclas traducidas «de:a», p. ej. 1:6,2:7,F1:1 (habilidades en 1-5 y armas en F1-F5); vacío = las del juego. Se cambian en F10 > Teclas

[Items]
AltToggle=1             ; un toque corto de Alt deja fijos los nombres del botín (otro los quita; mantener Alt invierte)
MinQuality=0            ; con nombres fijos, qué se ve: 0 todo, 1 desde mágicos (azul), 2 desde raros (amarillo), 3 set y únicos
Compare=1               ; al pasar el ratón por un objeto, muestra al lado la ficha del que llevas equipado en ese hueco
AutoGold=1              ; recoge el oro al pasar a su lado, sin agacharse ni hacer clic (solo partida individual)

[Hud]
HeroInfo=1              ; nivel y bonus de supervivencia junto al retrato
Quests=1                ; misiones activas (título y objetivo) a la izquierda, debajo del minimapa

[Debug]
; Herramientas de diagnóstico: todo a 0 para jugar.
CrashLog=0              ; registra en SacredFix.log los fallos graves y quién cierra el proceso
D3D11Perf=0             ; con d3d11: tiempos del motor en el log cada 10 s y los tirones de más de 50 ms
D3D11Trace2D=0          ; con d3d11: F11 escribe en el log los dibujos 2D del fotograma siguiente
D3D11ForceFail=0        ; con d3d11: simula que Direct3D 11 no arranca, para probar que pasa solo a Direct3D 9
D3DTrace=0              ; registra viewports, matrices y rangos de vértices de pantalla
UiDump=0                ; registra las llamadas 2D de la interfaz (para localizar piezas de los menús)
CallCounters=0          ; cuenta llamadas de la cadena de dibujo de personajes
ApiInventory=0          ; inventario de las llamadas a DirectDraw / Direct3D 7 (SacredFix_api.txt)
DumpHero=0              ; al entrar en la partida, copia la memoria del héroe en SacredFix_heroe.bin
DumpQuests=0            ; al entrar en la partida, guarda las misiones en SacredFix_misiones.bin
ShowTexts=              ; números de texto del juego que se escriben en el log al entrar en la partida
